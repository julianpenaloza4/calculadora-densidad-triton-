<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab-Sim: Cinética de Secado & Dureza Triton X-100</title>
  <!-- Google Fonts & Chart.js -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dashboard {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .dashboard { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(6, 182, 212, 0.4);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 14px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
    }

    .stat-value.highlight { color: var(--accent-green); }
    .stat-value.amber { color: var(--accent-amber); }

    /* RECUADRO DE SOLUCIÓN PREDICHA */
    .solution-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .solution-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-green);
      margin-bottom: 6px;
    }

    .solution-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.5;
    }

    .mold-status {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      transition: width 0.5s ease-in-out;
    }

    .chart-container {
      position: relative;
      height: 200px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="dashboard">
  <!-- PANEL IZQUIERDO: FORMULARIO DE ENTRADA -->
  <div class="card">
    <div class="card-title">🧪 Calculadora de Mezclas</div>
    
    <div class="input-group">
      <label>Tiempo de Secado / Hidratación <span>Intervalos de 180 min</span></label>
      <select id="tiempoSecado" onchange="simularCinéticaSecado()">
        <option value="180" selected>180 min (T1 - Desmoldeo Base)</option>
        <option value="360">360 min (T2 - 6 Horas)</option>
        <option value="540">540 min (T3 - 9 Horas)</option>
        <option value="720">720 min (T4 - 12 Horas)</option>
        <option value="1440">1440 min (24 Horas)</option>
      </select>
    </div>

    <div class="input-group">
      <label>Masa Cemento (g) <span>Recomendado: 100 g</span></label>
      <input type="number" id="cemento" value="100.0" step="0.1" oninput="simularCinéticaSecado()">
    </div>

    <div class="input-group">
      <label>Dosis Acelerante CaCl₂ (g) <span>1.5% m/m</span></label>
      <input type="number" id="cacl2" value="1.50" step="0.01" oninput="simularCinéticaSecado()">
    </div>

    <div class="input-group">
      <label>Volumen Agua (mL) <span>Relación A/C = 0.30</span></label>
      <input type="number" id="agua" value="30.0" step="0.1" oninput="simularCinéticaSecado()">
    </div>

    <div class="input-group">
      <label>Volumen Triton X-100 (mL) <span>0 - 1.89 mL</span></label>
      <input type="number" id="triton" value="0.94" step="0.01" oninput="simularCinéticaSecado()">
    </div>

    <div class="input-group">
      <label>Carbonato de Calcio CaCO₃ (g) <span>Opcional</span></label>
      <input type="number" id="caco3" value="0.0" step="0.1" oninput="simularCinéticaSecado()">
    </div>

    <button onclick="simularCinéticaSecado()">Calcular Solución Teórica</button>
  </div>

  <!-- PANEL DERECHO: RESULTADOS Y MENSAJE DE SOLUCIÓN -->
  <div class="card">
    <div class="card-title">📊 Solución Teórica & Cinética</div>

    <!-- RECUADRO DE SOLUCIÓN DINÁMICA -->
    <div class="solution-box" id="boxSolucion">
      <div class="solution-title">💡 Solución Estimada:</div>
      <div class="solution-text" id="mensajeSolucion">
        Calculando dureza esperada...
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-label">Dureza Esperada</div>
        <div class="stat-value amber" id="valDurezaTeorica">0.0 SH-A</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Densidad Corregida</div>
        <div class="stat-value highlight" id="valCorregida">0.00 g/cm³</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Masa Total</div>
        <div class="stat-value" id="valMasa">0.0 g</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Aire Ocluido Est.</div>
        <div class="stat-value" id="valAire">0.0%</div>
      </div>
    </div>

    <!-- Criterio de Desmoldeo (≥ 70 SH-A) -->
    <div class="mold-status">
      <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
        <span id="lblDesmoldeo">Desmoldeo Seguro (≥ 70 SH-A)</span>
        <strong id="valShoreText" style="color:var(--accent-cyan);">75.0 SH-A (APROBADO)</strong>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="shoreProgress" style="width: 75%;"></div>
      </div>
    </div>

    <!-- Gráfico de Cinética de Dureza -->
    <div class="chart-container">
      <canvas id="timeChart"></canvas>
    </div>
  </div>
</div>

<script>
let timeChart;

function inicializarGrafico() {
  const ctx = document.getElementById('timeChart').getContext('2d');
  timeChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['180 min', '360 min', '540 min', '720 min', '1440 min'],
      datasets: [
        {
          label: 'Evolución de Dureza (SH-A)',
          data: [],
          borderColor: '#f59e0b',
          backgroundColor: 'rgba(245, 158, 11, 0.15)',
          borderWidth: 3,
          fill: true,
          tension: 0.3,
          pointBackgroundColor: '#10b981',
          pointRadius: 6
        },
        {
          label: 'Criterio Desmoldeo (70 SH-A)',
          data: [70, 70, 70, 70, 70],
          borderColor: '#f43f5e',
          borderWidth: 2,
          borderDash: [6, 6],
          pointRadius: 0
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { min: 0, max: 100, ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

function simularCinéticaSecado() {
  const tSecado = parseInt(document.getElementById('tiempoSecado').value) || 180;
  const mCemento = parseFloat(document.getElementById('cemento').value) || 0;
  const mCacl2 = parseFloat(document.getElementById('cacl2').value) || 0;
  const vAgua = parseFloat(document.getElementById('agua').value) || 0;
  const vTriton = parseFloat(document.getElementById('triton').value) || 0;
  const mCaco3 = parseFloat(document.getElementById('caco3').value) || 0;

  const rhoCemento = 3.15, rhoAgua = 1.00, rhoCacl2 = 2.15, rhoTriton = 1.06, rhoCaco3 = 2.71;

  const mAgua = vAgua * rhoAgua;
  const mTriton = vTriton * rhoTriton;

  const vCemento = mCemento / rhoCemento;
  const vCacl2 = mCacl2 / rhoCacl2;
  const vCaco3 = mCaco3 > 0 ? mCaco3 / rhoCaco3 : 0;

  const masaTotal = mCemento + mCacl2 + mAgua + mTriton + mCaco3;
  const vTeorico = vCemento + vCacl2 + vAgua + vTriton + vCaco3;

  const dosisTritonPct = (mTriton / mCemento) * 100;
  const pctAire = 3.0 + (dosisTritonPct * 5.2);
  const vRealEstimado = vTeorico / (1 - (pctAire / 100));
  const rhoCorregida = masaTotal / vRealEstimado;

  // FUNCIÓN DE CINÉTICA EN EL TIEMPO
  function calcularDurezaAlTiempo(minutos, pctTX) {
    const durezaMaxSaturacion = 92.0 - (pctTX * 12.0);
    const kHidratacion = 0.0075;
    let dureza = durezaMaxSaturacion * (1 - Math.exp(-kHidratacion * minutos));
    return Math.max(0, Math.min(100, dureza));
  }

  const durezaTeoricaActual = calcularDurezaAlTiempo(tSecado, dosisTritonPct);

  // CONSTRUCCIÓN DEL MENSAJE DE SOLUCIÓN SOLICITADO
  const aprobado = durezaTeoricaActual >= 70.0;
  const textoSolucion = `Después de <strong>${tSecado} minutos</strong> de secado, la mezcla debería medir una dureza de <strong>${durezaTeoricaActual.toFixed(1)} SH-A</strong>.`;
  
  document.getElementById('mensajeSolucion').innerHTML = textoSolucion;

  // Cambiar el color del borde/fondo según desmolde o no
  const box = document.getElementById('boxSolucion');
  if (aprobado) {
    box.style.background = 'rgba(16, 185, 129, 0.1)';
    box.style.borderColor = 'rgba(16, 185, 129, 0.3)';
  } else {
    box.style.background = 'rgba(244, 63, 94, 0.1)';
    box.style.borderColor = 'rgba(244, 63, 94, 0.3)';
  }

  document.getElementById('valAire').innerText = pctAire.toFixed(1) + '%';
  document.getElementById('valMasa').innerText = masaTotal.toFixed(1) + ' g';
  document.getElementById('valCorregida').innerText = rhoCorregida.toFixed(3) + ' g/cm³';
  document.getElementById('valDurezaTeorica').innerText = durezaTeoricaActual.toFixed(1) + ' SH-A';

  document.getElementById('valShoreText').innerText = durezaTeoricaActual.toFixed(1) + ' SH-A ' + (aprobado ? '✅ (DESMOLDA)' : '❌ (NO DESMOLDA)');
  document.getElementById('valShoreText').style.color = aprobado ? '#10b981' : '#f43f5e';
  document.getElementById('shoreProgress').style.width = Math.min(100, durezaTeoricaActual) + '%';
  document.getElementById('shoreProgress').style.background = aprobado ? 'linear-gradient(90deg, #10b981, #06b6d4)' : 'linear-gradient(90deg, #f43f5e, #fb923c)';

  const intervalosTiempo = [180, 360, 540, 720, 1440];
  const datosCurvaTiempo = intervalosTiempo.map(t => calcularDurezaAlTiempo(t, dosisTritonPct).toFixed(1));

  timeChart.data.datasets[0].data = datosCurvaTiempo;
  timeChart.update();
}

window.onload = () => {
  inicializarGrafico();
  simularCinéticaSecado();
};
</script>

</body>
</html>
